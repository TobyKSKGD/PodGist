# ================= electron-builder 配置 =================
# PodGist 桌面应用打包配置


# 打包目标平台
target:
  - target: nsis
    arch:
      - x64
  - target: dmg
    arch:
      - arm64

# App 元数据
appId: com.podgist.desktop
productName: PodGist
copyright: Copyright © 2026 PodGist Team
icon: assets/icon.ico

# 构建产物输出目录
directories:
  output: ../release/${version}

# NSIS Windows 安装包配置
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PodGist
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  uninstallDisplayName: PodGist

# DMG macOS 安装包配置
dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  window:
    width: 600
    height: 400
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ================= macOS 配置 =================
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: assets/entitlements.plist
  entitlementsInherit: assets/entitlements.plist
  icon: assets/Icon.icns
  target:
    - dmg
  files:
    - src/**/*
    - package.json
    - backend/**/*
    - api.py
    - requirements.txt
    - frontend-dist/**/*
  asarUnpack:
    - backend/**/*
    - api.py
    - requirements.txt
    - frontend-dist/**/*
  extraResources:
    - from: resources/ffmpeg
      to: ffmpeg
      filter:
        - "**/*"
    - from: resources/python_venv
      to: python_venv
      filter:
        - "**/*"

# ================= Windows 配置 =================
win:
  icon: assets/icon.ico
  executableName: PodGist
  forceCodeSigning: false

  # 关键修复：
  # 必须开启，electron-builder 才会把 app icon / metadata / execution level 写进主程序 EXE
  signAndEditExecutable: true

  publish: null
  target:
    - target: nsis
      arch:
        - x64

  # Windows 只需要 Electron 端文件，后端通过 extraResources 带入 resources/api
  files:
    - src/**/*
    - package.json
    - frontend-dist/**/*

  asarUnpack:
    - frontend-dist/**/*

  extraResources:
    - from: assets/icon.ico
      to: icon.ico
    - from: resources/ffmpeg
      to: ffmpeg
      filter:
        - "**/*"
    - from: dist/api
      to: api
      filter:
        - "**/*"
