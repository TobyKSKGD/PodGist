# ================= electron-builder 配置 =================
# PodGist 桌面应用打包配置
# 统一构建：macOS (dmg) + Windows (nsis)

# 打包目标平台
target:
  - target: nsis
    arch:
      - x64
  - target: dmg
    arch:
      - arm64

# App 元数据
appId: com.podgist.desktop
productName: PodGist
copyright: Copyright © 2026 PodGist Team
icon: assets/icon.ico

# 构建产物输出目录
directories:
  output: ../release/${version}

# NSIS Windows 安装包配置
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PodGist
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  uninstallDisplayName: PodGist

# DMG macOS 安装包配置
dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  window:
    width: 600
    height: 400
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ================= macOS 配置 =================
mac:
  category: public.app-category.productivity
  # 签名配置：
  #   - CI 环境：sign: false（当前无 Apple Developer ID 证书）
  #   - 正式发布：需要设置 secrets.APPLE_SIGNING_IDENTITY 和 secrets.APPLE_NOTARIZATION
  #   - electron-builder 会自动读取环境变量 APPLE_SIGNING_IDENTITY 和 APPLE_NOTARIZATION
  # 注意：无签名+未公证的应用在 macOS 14+ Gatekeeper 会拦截并报"已损坏"
  sign: false
  entitlements: assets/entitlements.plist
  entitlementsInherit: assets/entitlements.plist
  icon: assets/Icon.icns
  target:
    - dmg
  # 打包文件：来自 electron/ 目录（由 prebuild 从根目录复制）
  files:
    - src/**/*
    - package.json
    - backend/**/*
    - api.py
    - requirements.txt
    - frontend-dist/**/*
  asarUnpack:
    - backend/**/*
    - api.py
    - requirements.txt
    - frontend-dist/**/*
  # extraResources: 后端 PyInstaller 产物（优先级最高）+ FFmpeg
  # 注意：python_venv 已被废弃（符号链接+CI路径不可移植）
  # 请使用 dist/api（macOS 后端独立二进制）替代
  extraResources:
    - from: resources/ffmpeg
      to: ffmpeg
      filter:
        - "**/*"
    - from: dist/api
      to: api
      filter:
        - "**/*"

# ================= Windows 配置 =================
win:
  icon: assets/icon.ico
  executableName: PodGist
  forceCodeSigning: false
  # 必须开启，electron-builder 才会把 app icon / metadata / execution level 写进主程序 EXE
  signAndEditExecutable: true
  publish: null
  target:
    - target: nsis
      arch:
        - x64
  # Windows 打包文件
  files:
    - src/**/*
    - package.json
    - frontend-dist/**/*
  asarUnpack:
    - frontend-dist/**/*
  # 后端 PyInstaller 产物（由 scripts/release/build-backend-win.ps1 放置）
  extraResources:
    - from: assets/icon.ico
      to: icon.ico
    - from: resources/ffmpeg
      to: ffmpeg
      filter:
        - "**/*"
    - from: dist/api
      to: api
      filter:
        - "**/*"
