name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0) - leave empty to skip release creation'
        required: false
        default: ''
      platform:
        description: '构建平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ===== Job A: 创建/验证 Draft Release =====
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine-tag.outputs.tag }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: determine-tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
            echo "Event: push tag = $TAG"
          else
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
              echo "Event: workflow_dispatch with explicit tag = $TAG"
            else
              TAG=""
              echo "Event: workflow_dispatch without tag, skipping release creation"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Create draft release
        if: steps.determine-tag.outputs.tag != ''
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ steps.determine-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== Job B: 构建矩阵 (mac + win) =====
  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_pattern: '*.dmg'
          - os: windows-latest
            platform: win
            artifact_pattern: '*.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ===== 前端构建 (两个平台都需要) =====
      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      # ===== Windows 专属步骤 =====
      - name: Setup Python (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python deps (Windows)
        if: matrix.platform == 'win'
        run: pip install -r requirements.txt

      - name: Install PyInstaller (Windows)
        if: matrix.platform == 'win'
        run: pip install pyinstaller==6.19.0

      - name: Syntax check backend
        if: matrix.platform == 'win'
        run: python scripts/check_backend.py

      - name: Build backend (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/release/build-backend-win.ps1

      - name: Fetch FFmpeg (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/release/fetch-ffmpeg-win.ps1

      # ===== macOS 专属步骤 =====
      - name: Setup Python (macOS)
        if: matrix.platform == 'mac'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Bootstrap runtime (macOS)
        if: matrix.platform == 'mac'
        run: bash scripts/release/bootstrap-runtime-mac.sh

      - name: Install PyInstaller (macOS)
        if: matrix.platform == 'mac'
        run: pip install pyinstaller==6.19.0

      - name: Syntax check backend (macOS)
        if: matrix.platform == 'mac'
        run: python scripts/check_backend.py

      - name: Build backend (macOS)
        if: matrix.platform == 'mac'
        run: bash scripts/release/build-backend-mac.sh

      # ===== Electron 安装依赖 =====
      - name: Install electron deps
        run: npm ci
        working-directory: electron

      # ===== Electron 构建（走完整构建链：包含 prebuild） =====
      - name: Build Electron (${{ matrix.platform }})
        run: |
          echo "electron-builder version: $(node -p 'require("./package.json").version')"
          npm run build:${{ matrix.platform }}
        working-directory: electron

      # ===== 查找 unpacked 目录（用于验包） =====
      - name: Locate unpacked app (Windows)
        if: matrix.platform == 'win'
        id: locate-win-unpacked
        shell: pwsh
        run: |
          # electron-builder 将 unpacked 输出到 repo root release/{version}/win-unpacked
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "Current directory: $PWD"
          # 递归查找 win-unpacked 目录
          $unpacked = Get-ChildItem "release" -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "win-unpacked" } | Select-Object -First 1
          if ($unpacked) {
            $path = $unpacked.FullName
            echo "path=$path" >> $env:GITHUB_OUTPUT
            echo "Found: $path"
          } else {
            Write-Host "ERROR: No win-unpacked directory found in release/"
            Get-ChildItem "release" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
            exit 1
          }

      - name: Locate unpacked app (macOS)
        if: matrix.platform == 'mac'
        id: locate-mac-unpacked
        run: |
          # macOS DMG 挂载后包含 unpacked .app
          # electron-builder 输出到 repo root release/ (非 electron/release/)
          for dir in release electron/release electron/out; do
            app=$(find "$dir" -name "PodGist.app" -type d 2>/dev/null | head -1)
            if [ -n "$app" ]; then
              echo "path=$app" >> $GITHUB_OUTPUT
              echo "Found: $app"
              exit 0
            fi
          done
          echo "ERROR: No PodGist.app found in release/ or electron/release/"
          exit 1

      # ===== 目标二：验包（打包完成后验证关键文件） =====
      - name: Verify Windows package contents
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $unpacked = "${{ steps.locate-win-unpacked.outputs.path }}"
          $errors = @()

          Write-Host "=== 验包: Windows unpacked ==="
          Write-Host "Unpacked path: $unpacked"

          # 检查 api-engine.exe
          $apiEngine = Join-Path $unpacked "resources\api\api-engine.exe"
          if (Test-Path $apiEngine) {
            $size = [math]::Round((Get-Item $apiEngine).Length / 1MB, 2)
            Write-Host "[OK] resources/api/api-engine.exe ($size MB)" -ForegroundColor Green
          } else {
            Write-Host "[MISSING] resources/api/api-engine.exe" -ForegroundColor Red
            $errors += "api-engine.exe"
          }

          # 检查 ffmpeg.exe
          $ffmpeg = Join-Path $unpacked "resources\ffmpeg\ffmpeg.exe"
          if (Test-Path $ffmpeg) {
            Write-Host "[OK] resources/ffmpeg/ffmpeg.exe" -ForegroundColor Green
          } else {
            Write-Host "[MISSING] resources/ffmpeg/ffmpeg.exe" -ForegroundColor Red
            $errors += "ffmpeg.exe"
          }

          # 检查 ffprobe.exe
          $ffprobe = Join-Path $unpacked "resources\ffmpeg\ffprobe.exe"
          if (Test-Path $ffprobe) {
            Write-Host "[OK] resources/ffmpeg/ffprobe.exe" -ForegroundColor Green
          } else {
            Write-Host "[MISSING] resources/ffmpeg/ffprobe.exe" -ForegroundColor Red
            $errors += "ffprobe.exe"
          }

          # 列出 resources 目录内容（用于调试）
          Write-Host ""
          Write-Host "=== resources/ 目录内容 ==="
          $resourcesDir = Join-Path $unpacked "resources"
          if (Test-Path $resourcesDir) {
            Get-ChildItem $resourcesDir | ForEach-Object { Write-Host "  $($_.Name)/" }
          } else {
            Write-Host "  (resources dir not found!)" -ForegroundColor Red
          }

          # 验包失败则禁止上传
          if ($errors.Count -gt 0) {
            Write-Host ""
            Write-Host "ERROR: 验包失败，以下文件缺失: $($errors -join ', ')" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "=== 验包通过 ===" -ForegroundColor Green

      - name: Verify macOS package contents
        if: matrix.platform == 'mac'
        run: |
          set -e
          APP_PATH="${{ steps.locate-mac-unpacked.outputs.path }}"
          ERRORS=0
          WARNINGS=0

          echo "=== 验包: macOS PodGist.app ==="
          echo "App path: $APP_PATH"

          # =============================================
          # 1. 检查 app.asar.unpacked/backend/start_electron.py
          # =============================================
          START_SCRIPT="$APP_PATH/Contents/Resources/app.asar.unpacked/backend/start_electron.py"
          if [ -f "$START_SCRIPT" ]; then
            echo "[OK] app.asar.unpacked/backend/start_electron.py"
          else
            echo "[MISSING] app.asar.unpacked/backend/start_electron.py"
            ERRORS=$((ERRORS+1))
          fi

          # =============================================
          # 2. 检查 python_venv 目录结构
          # =============================================
          VENV_PATH="$APP_PATH/Contents/Resources/python_venv"
          if [ -d "$VENV_PATH" ]; then
            echo "[OK] Contents/Resources/python_venv/ (directory exists)"
          else
            echo "[MISSING] Contents/Resources/python_venv/"
            ERRORS=$((ERRORS+1))
          fi

          VENV_BIN_PYTHON3="$VENV_PATH/bin/python3"
          VENV_BIN_PYTHON="$VENV_PATH/bin/python"
          VENV_PYVENV_CFG="$VENV_PATH/pyvenv.cfg"

          # =============================================
          # 3. 检查 python3 是否为符号链接（破坏可移植性）
          # =============================================
          echo ""
          echo "=== venv 可移植性诊断 ==="
          if [ -L "$VENV_BIN_PYTHON3" ]; then
            TARGET=$(readlink "$VENV_BIN_PYTHON3")
            echo "[FAIL] python3 is a SYMLINK: $VENV_BIN_PYTHON3 -> $TARGET"
            if echo "$TARGET" | grep -q "^/"; then
              echo "       *** ABSOLUTE symlink detected - will BREAK on end-user machines!"
              echo "       *** This venv was created WITHOUT --copies flag!"
              ERRORS=$((ERRORS+1))
            else
              echo "       [INFO] Relative symlink (unusual but may work)"
              WARNINGS=$((WARNINGS+1))
            fi
          elif [ -f "$VENV_BIN_PYTHON3" ]; then
            echo "[OK] python3 is a regular file (not symlink)"
          else
            echo "[MISSING] python3 not found at all"
            ERRORS=$((ERRORS+1))
          fi

          # =============================================
          # 4. 检查 python 符号链接
          # =============================================
          if [ -L "$VENV_BIN_PYTHON" ]; then
            TARGET=$(readlink "$VENV_BIN_PYTHON")
            echo "[FAIL] python is a SYMLINK: $VENV_BIN_PYTHON -> $TARGET"
            if echo "$TARGET" | grep -q "^/"; then
              echo "       *** ABSOLUTE symlink - will BREAK on end-user machines!"
              ERRORS=$((ERRORS+1))
            fi
          elif [ -f "$VENV_BIN_PYTHON" ]; then
            echo "[OK] python is a regular file (not symlink)"
          fi

          # =============================================
          # 5. 检查 pyvenv.cfg 是否含 CI 构建机路径
          # =============================================
          echo ""
          echo "=== pyvenv.cfg 内容检查 ==="
          if [ -f "$VENV_PYVENV_CFG" ]; then
            echo "pyvenv.cfg contents:"
            cat "$VENV_PYVENV_CFG" | sed 's/^/  /'
            if grep -q "/Users/runner/" "$VENV_PYVENV_CFG" 2>/dev/null; then
              echo "[FAIL] CI runner path detected in pyvenv.cfg!"
              echo "       Path contains /Users/runner/ - will break on other machines!"
              ERRORS=$((ERRORS+1))
            elif grep -q "/home/" "$VENV_PYVENV_CFG" 2>/dev/null; then
              echo "[FAIL] Linux home path detected in pyvenv.cfg!"
              ERRORS=$((ERRORS+1))
            else
              echo "[OK] No CI/Linux path detected in pyvenv.cfg"
            fi
          else
            echo "[MISSING] pyvenv.cfg not found"
            ERRORS=$((ERRORS+1))
          fi

          # =============================================
          # 6. 检查 api-engine 后端二进制（新的分发方式）
          # =============================================
          echo ""
          echo "=== 后端二进制检查 ==="
          API_ENGINE="$APP_PATH/Contents/Resources/api/api-engine"
          if [ -f "$API_ENGINE" ]; then
            echo "[OK] Contents/Resources/api/api-engine (standalone binary exists)"
          else
            echo "[INFO] Contents/Resources/api/api-engine not found (may be using venv fallback)"
          fi

          # =============================================
          # 7. 检查 ffmpeg
          # =============================================
          echo ""
          echo "=== FFmpeg 检查 ==="
          FFMPEG="$APP_PATH/Contents/Resources/ffmpeg/ffmpeg"
          if [ -f "$FFMPEG" ]; then
            echo "[OK] Contents/Resources/ffmpeg/ffmpeg"
          else
            echo "[MISSING] Contents/Resources/ffmpeg/ffmpeg"
            ERRORS=$((ERRORS+1))
          fi

          FFPROBE="$APP_PATH/Contents/Resources/ffmpeg/ffprobe"
          if [ -f "$FFPROBE" ]; then
            echo "[OK] Contents/Resources/ffmpeg/ffprobe"
          else
            echo "[MISSING] Contents/Resources/ffmpeg/ffprobe"
            ERRORS=$((ERRORS+1))
          fi

          # =============================================
          # 8. 列出 Resources 目录内容
          # =============================================
          echo ""
          echo "=== Contents/Resources/ 目录树 ==="
          ls -la "$APP_PATH/Contents/Resources/" 2>/dev/null || true
          if [ -d "$APP_PATH/Contents/Resources/python_venv" ]; then
            echo "python_venv/bin/ contents:"
            ls -la "$APP_PATH/Contents/Resources/python_venv/bin/" 2>/dev/null | head -15 || true
          fi

          # =============================================
          # 9. NON-PORTABLE VENV 警告标记
          # =============================================
          if [ -L "$VENV_BIN_PYTHON3" ] || grep -q "/Users/runner/" "$VENV_PYVENV_CFG" 2>/dev/null; then
            echo ""
            echo "!!! NON-PORTABLE VENV DETECTED !!!" -ForegroundColor Red
            echo "    This venv will NOT work on end-user machines!"
            echo "    Recommendation: Use standalone api-engine binary instead."
          fi

          # =============================================
          # 10. 代码签名诊断
          # =============================================
          echo ""
          echo "=== 代码签名诊断 ==="
          echo "codesign -dv output:"
          codesign -dv "$APP_PATH" 2>&1 || true
          echo ""
          echo "codesign --verify --deep --strict output:"
          codesign --verify --deep --strict "$APP_PATH" 2>&1 || true

          # =============================================
          # 11. Gatekeeper 评估
          # =============================================
          echo ""
          echo "=== Gatekeeper spctl 评估 ==="
          echo "spctl --assess --type execute -vvv output:"
          spctl --assess --type execute -vvv "$APP_PATH" 2>&1 || true

          # =============================================
          # 12. Extended Attributes 检查
          # =============================================
          echo ""
          echo "=== Extended Attributes (xattr) ==="
          xattr -lr "$APP_PATH" 2>/dev/null || true

          # =============================================
          # 验包失败则禁止上传
          # =============================================
          echo ""
          if [ $ERRORS -gt 0 ]; then
            echo "ERROR: 验包失败，$ERRORS 个错误"
            exit 1
          fi
          if [ $WARNINGS -gt 0 ]; then
            echo "WARNING: $WARNINGS 个警告（但验包通过）"
          fi
          echo ""
          echo "=== 验包通过 ===" -ForegroundColor Green

      # ===== 查找最终安装包产物 =====
      - name: Find installer (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        id: find-win
        run: |
          echo "=== Searching for .exe installer ==="
          $artifacts = Get-ChildItem "electron/release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            $artifacts = Get-ChildItem "release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          }
          if ($artifacts) {
            $artifacts | ForEach-Object {
              Write-Host "Found: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
            }
            $first = $artifacts | Select-Object -First 1
            Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($first.FullName)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($first.Name)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "size=$([math]::Round($first.Length / 1MB, 2)) MB"
          } else {
            Write-Host "ERROR: No .exe installer found"
            exit 1
          }

      - name: Find installer (macOS)
        if: matrix.platform == 'mac'
        id: find-mac
        run: |
          echo "=== Searching for .dmg installer ==="
          for dir in electron/release release electron/out; do
            dmgs=$(find "$dir" -name "*.dmg" -type f 2>/dev/null | head -1)
            if [ -n "$dmgs" ]; then
              echo "Found DMG: $dmgs"
              echo "path=$dmgs" >> $GITHUB_OUTPUT
              echo "name=$(basename $dmgs)" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "ERROR: No .dmg found"
          exit 1

      # ===== 上传 installer artifact =====
      - name: Upload installer artifact (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: podgist-windows
          path: ${{ steps.find-win.outputs.path }}
          retention-days: 5

      - name: Upload installer artifact (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: podgist-macos
          path: ${{ steps.find-mac.outputs.path }}
          retention-days: 5

  # ===== Job C: 统一发布（Linux 中执行 gh release upload） =====
  publish-assets:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    if: needs.create-release.outputs.tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | while read f; do
            echo "  $f ($(du -h "$f" | cut -f1))"
          done

      - name: Set artifact paths
        id: artifacts
        run: |
          WIN_EXE=$(find artifacts -name "*.exe" -type f | head -1)
          MAC_DMG=$(find artifacts -name "*.dmg" -type f | head -1)
          echo "win_path=$WIN_EXE" >> $GITHUB_OUTPUT
          echo "mac_path=$MAC_DMG" >> $GITHUB_OUTPUT
          echo "Windows artifact: $WIN_EXE"
          echo "macOS artifact: $MAC_DMG"

      - name: Upload Windows artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ASSET_PATH: ${{ steps.artifacts.outputs.win_path }}
        run: |
          echo "Uploading Windows artifact to release $TAG..."
          gh release upload "$TAG" "$ASSET_PATH" --clobber

      - name: Upload macOS artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ASSET_PATH: ${{ steps.artifacts.outputs.mac_path }}
        run: |
          echo "Uploading macOS artifact to release $TAG..."
          gh release upload "$TAG" "$ASSET_PATH" --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "=== Verifying release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) (\(.size | tonumber / 1024 / 1024 | floor) MB)"'
