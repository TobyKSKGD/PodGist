name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0) - leave empty to skip release creation'
        required: false
        default: ''
      platform:
        description: '构建平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ===== Job A: 创建/验证 Draft Release =====
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine-tag.outputs.tag }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: determine-tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
            echo "Event: push tag = $TAG"
          else
            # workflow_dispatch: 只在用户明确提供 tag 时才创建 release
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
              echo "Event: workflow_dispatch with explicit tag = $TAG"
            else
              TAG=""
              echo "Event: workflow_dispatch without tag, skipping release creation"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Create draft release
        if: steps.determine-tag.outputs.tag != ''
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ steps.determine-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== Job B: 构建矩阵 (mac + win) =====
  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_pattern: '*.dmg'
          - os: windows-latest
            platform: win
            artifact_pattern: '*.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ===== 前端构建 (两个平台都需要) =====
      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      # ===== Windows 专属步骤 =====
      - name: Setup Python (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python deps (Windows)
        if: matrix.platform == 'win'
        run: pip install -r requirements.txt

      - name: Install PyInstaller (Windows)
        if: matrix.platform == 'win'
        run: pip install pyinstaller==6.19.0

      - name: Syntax check backend
        if: matrix.platform == 'win'
        run: python scripts/check_backend.py

      - name: Build backend (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/release/build-backend-win.ps1

      - name: Fetch FFmpeg (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/release/fetch-ffmpeg-win.ps1

      # ===== macOS 专属步骤 =====
      - name: Setup Python (macOS)
        if: matrix.platform == 'mac'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Bootstrap runtime (macOS)
        if: matrix.platform == 'mac'
        run: bash scripts/release/bootstrap-runtime-mac.sh

      - name: Syntax check backend (macOS)
        if: matrix.platform == 'mac'
        run: python scripts/check_backend.py

      # ===== Electron 构建 =====
      - name: Install electron deps
        run: npm ci
        working-directory: electron

      - name: Build Electron (${{ matrix.platform }})
        run: |
          echo "electron-builder version: $(node -p 'require("./package.json").version')"
          npm run build:ci:${{ matrix.platform }}
        working-directory: electron

      # ===== 查找产物 =====
      - name: Find artifact (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        id: find-win
        run: |
          echo "=== Searching for .exe artifacts ==="
          echo "Searching electron/release/:"
          $artifacts = Get-ChildItem "electron/release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            $artifacts = Get-ChildItem "release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
            $searchDir = "release"
          } else {
            $searchDir = "electron/release"
          }
          if ($artifacts) {
            $artifacts | ForEach-Object {
              Write-Host "Found: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
            }
            $first = $artifacts | Select-Object -First 1
            Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($first.FullName)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($first.Name)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "size=$([math]::Round($first.Length / 1MB, 2)) MB"
          } else {
            Write-Host "ERROR: No .exe found in electron/release/ or release/"
            exit 1
          }

      - name: Find artifact (macOS)
        if: matrix.platform == 'mac'
        id: find-mac
        run: |
          echo "=== Searching for .dmg artifacts ==="
          echo "Searching electron/release/:"
          find electron/release/ -name "*.dmg" -type f 2>/dev/null || echo "  (not found)"
          echo "Searching release/:"
          find release/ -name "*.dmg" -type f 2>/dev/null || echo "  (not found)"
          echo "Searching electron/out/:"
          find electron/out/ -name "*.dmg" -type f 2>/dev/null || echo "  (not found)"
          echo "Listing electron/ directory:"
          ls -la electron/ 2>/dev/null || echo "  (not found)"
          echo "Listing release/ directory:"
          ls -la release/ 2>/dev/null || echo "  (not found)"

          # 查找 dmg（搜索多个可能的位置）
          DMG_PATH=""
          for dir in electron/release release electron/out; do
            dmgs=$(find "$dir" -name "*.dmg" -type f 2>/dev/null | head -1)
            if [ -n "$dmgs" ]; then
              DMG_PATH="$dmgs"
              break
            fi
          done

          if [ -n "$DMG_PATH" ]; then
            echo "Found DMG: $DMG_PATH"
            echo "path=$DMG_PATH" >> $GITHUB_OUTPUT
            echo "name=$(basename $DMG_PATH)" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No .dmg found"
            exit 1
          fi

      # ===== 上传 artifact（由 publish-assets job 统一发布） =====
      - name: Upload artifact (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: podgist-windows
          path: ${{ steps.find-win.outputs.path }}
          retention-days: 5

      - name: Upload artifact (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: podgist-macos
          path: ${{ steps.find-mac.outputs.path }}
          retention-days: 5

  # ===== Job C: 统一发布（Linux 中执行 gh release upload） =====
  publish-assets:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    # 只有在 create-release 确定了 tag 时才运行
    if: needs.create-release.outputs.tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | while read f; do
            echo "  $f ($(du -h "$f" | cut -f1))"
          done

      - name: Set artifact paths
        id: artifacts
        run: |
          WIN_EXE=$(find artifacts -name "*.exe" -type f | head -1)
          MAC_DMG=$(find artifacts -name "*.dmg" -type f | head -1)
          echo "win_path=$WIN_EXE" >> $GITHUB_OUTPUT
          echo "mac_path=$MAC_DMG" >> $GITHUB_OUTPUT
          echo "Windows artifact: $WIN_EXE"
          echo "macOS artifact: $MAC_DMG"

      - name: Upload Windows artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ASSET_PATH: ${{ steps.artifacts.outputs.win_path }}
        run: |
          echo "Uploading Windows artifact to release $TAG..."
          echo "Path: $ASSET_PATH"
          gh release upload "$TAG" "$ASSET_PATH" --clobber

      - name: Upload macOS artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ASSET_PATH: ${{ steps.artifacts.outputs.mac_path }}
        run: |
          echo "Uploading macOS artifact to release $TAG..."
          echo "Path: $ASSET_PATH"
          gh release upload "$TAG" "$ASSET_PATH" --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "=== Verifying release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
