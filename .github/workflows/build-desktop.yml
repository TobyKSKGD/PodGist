name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0) - leave empty to skip release creation'
        required: false
        default: ''
      platform:
        description: '构建平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ===== Job A: 创建/验证 Draft Release =====
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine-tag.outputs.tag }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: determine-tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
            echo "Event: push tag = $TAG"
          else
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
              echo "Event: workflow_dispatch with explicit tag = $TAG"
            else
              TAG=""
              echo "Event: workflow_dispatch without tag, skipping release creation"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Create draft release
        if: steps.determine-tag.outputs.tag != ''
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ steps.determine-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== Job B: macOS 构建 =====
  build-mac:
    needs: create-release
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ===== 前端构建 =====
      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      # ===== macOS 专属步骤 =====
      - name: Setup Python (macOS)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Bootstrap runtime (macOS)
        run: bash scripts/release/bootstrap-runtime-mac.sh

      - name: Install PyInstaller (macOS)
        run: |
          VENV_PYTHON="$GITHUB_WORKSPACE/electron/resources/python_venv/bin/python3"
          "$VENV_PYTHON" -m pip install pyinstaller==6.19.0

      - name: Syntax check backend (macOS)
        run: python scripts/check_backend.py

      - name: Build backend (macOS)
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: bash scripts/release/build-backend-mac.sh

      # ===== Electron 安装依赖 =====
      - name: Install electron deps
        run: npm ci
        working-directory: electron

      # ===== Electron 构建（包含 afterPack ad-hoc signing） =====
      - name: Build Electron (mac)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          echo "electron-builder version: $(node -p 'require("./package.json").version')"
          npm run build:mac
        working-directory: electron

      # ===== 查找 unpacked 目录（用于验包） =====
      - name: Locate unpacked app (macOS)
        id: locate-mac-unpacked
        run: |
          # macOS DMG 挂载后包含 unpacked .app
          # electron-builder 输出到 repo root release/ (非 electron/release/)
          for dir in release electron/release electron/out; do
            app=$(find "$dir" -name "PodGist.app" -type d 2>/dev/null | head -1)
            if [ -n "$app" ]; then
              echo "path=$app" >> $GITHUB_OUTPUT
              echo "Found: $app"
              exit 0
            fi
          done
          echo "ERROR: No PodGist.app found in release/ or electron/release/"
          exit 1

      # ===== 两层验包：结构完整性 + Gatekeeper 信任级别 =====
      - name: Verify macOS package (structural + trust)
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.locate-mac-unpacked.outputs.path }}"
          ERRORS=0

          echo ""
          echo "=== 验包: macOS PodGist.app ==="
          echo "App path: $APP_PATH"

          # =============================================
          # [1/3] 结构完整性检查
          # =============================================
          echo ""
          echo "=== [1/3] 结构完整性检查 ==="

          START_SCRIPT="$APP_PATH/Contents/Resources/app.asar.unpacked/backend/start_electron.py"
          if [ -f "$START_SCRIPT" ]; then
            echo "[OK] start_electron.py"
          else
            echo "[MISSING] start_electron.py"
            ERRORS=$((ERRORS+1))
          fi

          API_ENGINE="$APP_PATH/Contents/Resources/api/api-engine"
          if [ -f "$API_ENGINE" ]; then
            SIZE=$(stat -f%z "$API_ENGINE" 2>/dev/null || stat -c%s "$API_ENGINE" 2>/dev/null || echo "unknown")
            echo "[OK] api-engine ($SIZE bytes)"
          else
            echo "[MISSING] api-engine — 构建不完整"
            ERRORS=$((ERRORS+1))
          fi

          FFMPEG="$APP_PATH/Contents/Resources/ffmpeg/ffmpeg"
          if [ -f "$FFMPEG" ]; then
            echo "[OK] ffmpeg"
          else
            echo "[MISSING] ffmpeg"
            ERRORS=$((ERRORS+1))
          fi

          FFPROBE="$APP_PATH/Contents/Resources/ffmpeg/ffprobe"
          if [ -f "$FFPROBE" ]; then
            echo "[OK] ffprobe"
          else
            echo "[MISSING] ffprobe"
            ERRORS=$((ERRORS+1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "ERROR: 结构不完整，$ERRORS 个文件缺失"
            exit 1
          fi

          # =============================================
          # [2/3] codesign 签名验证（硬门槛）
          # =============================================
          echo ""
          echo "=== [2/3] codesign 签名验证 ==="
          if codesign --verify --deep --strict --verbose=4 "$APP_PATH" 2>&1; then
            echo "[PASS] codesign 验证通过 — app 结构完整"
          else
            echo "[FAIL] codesign 验证失败 — app 结构损坏或签名不完整"
            exit 1
          fi

          # =============================================
          # [3/3] Gatekeeper 评估（Preview 允许 rejected）
          # =============================================
          echo ""
          echo "=== [3/3] Gatekeeper 评估 ==="

          # Preview 检测：任一正式签名 secrets 存在即为正式构建
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]] || [[ -n "${APPLE_ID:-}" ]] || [[ -n "${APPLE_API_KEY_ID:-}" ]]; then
            IS_PREVIEW=0
          else
            IS_PREVIEW=1
          fi

          # spctl 可能返回非 0，用 set +e 防止误退出
          set +e
          SPCTL_OUTPUT="$(spctl --assess --type execute -vvv "$APP_PATH" 2>&1)"
          SPCTL_EXIT=$?
          set -e

          echo "$SPCTL_OUTPUT"
          echo ""

          if [[ "$IS_PREVIEW" -eq 1 ]]; then
            # ===== Preview 构建 =====
            echo "========================================"
            echo "  UNSIGNED PREVIEW BUILD (macOS)"
            echo "  此构建为 ad-hoc 签名预览版"
            echo "========================================"
            if [[ "$SPCTL_EXIT" -ne 0 ]]; then
              echo "PREVIEW BUILD: structurally valid, not trusted by Gatekeeper."
              echo ""
              echo "  用户首次打开时："
              echo "    1. 双击 App"
              echo "    2. 系统弹出安全提示"
              echo "    3. 点击\"仍要打开\"即可"
              echo "    4. 不需要终端命令"
            else
              echo "[UNEXPECTED] Preview build accepted by spctl"
            fi
          else
            # ===== 正式签名/公证构建 =====
            echo "========================================"
            echo "  SIGNED + NOTARIZED BUILD"
            echo "========================================"
            if [[ "$SPCTL_EXIT" -ne 0 ]]; then
              echo "ERROR: spctl assess failed — 正式签名/公证构建不被 Gatekeeper 信任"
              exit 1
            else
              echo "[PASS] Gatekeeper 评估通过"
            fi
          fi

          echo ""
          echo "=== 验包通过 ==="

      # ===== 查找最终安装包产物 =====
      - name: Find installer (macOS)
        id: find-mac
        run: |
          echo "=== Searching for .dmg installer ==="
          for dir in electron/release release electron/out; do
            dmgs=$(find "$dir" -name "*.dmg" -type f 2>/dev/null | head -1)
            if [ -n "$dmgs" ]; then
              echo "Found DMG: $dmgs"
              SIZE=$(stat -f%z "$dmgs" 2>/dev/null || stat -c%s "$dmgs" 2>/dev/null)
              SHA256=$(shasum -a 256 "$dmgs" | cut -d' ' -f1)
              echo "path=$dmgs" >> $GITHUB_OUTPUT
              echo "name=$(basename $dmgs)" >> $GITHUB_OUTPUT
              echo "size=$(echo "scale=2; $SIZE / 1048576" | bc) MB" >> $GITHUB_OUTPUT
              echo "sha256=$SHA256" >> $GITHUB_OUTPUT
              echo "SHA256: $SHA256"
              exit 0
            fi
          done
          echo "ERROR: No .dmg found"
          exit 1

      # ===== 上传 installer artifact =====
      - name: Upload installer artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: podgist-macos
          path: ${{ steps.find-mac.outputs.path }}
          retention-days: 5

  # ===== Job C: Windows 构建 =====
  build-win:
    needs: create-release
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'win'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ===== 前端构建 =====
      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      # ===== Windows 专属步骤 =====
      - name: Setup Python (Windows)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies (Windows)
        run: python -m pip install -r requirements.txt --no-cache

      - name: Fetch FFmpeg (Windows)
        shell: pwsh
        run: pwsh -File ./scripts/release/fetch-ffmpeg-win.ps1

      - name: Install PyInstaller (Windows)
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.19.0

      - name: Syntax check backend
        shell: pwsh
        run: python scripts/check_backend.py

      - name: Build backend (Windows)
        shell: pwsh
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: pwsh -File ./scripts/release/build-backend-win.ps1

      # ===== 验证 uvicorn 是否被打进 _internal =====
      # uvicorn 可能打包进 .pyd/.pyz，不在文件系统中可见
      # 用简单启动测试验证（不查文件列表）
      - name: Verify uvicorn in packaged build
        shell: pwsh
        run: |
          $apiEngine = Join-Path "${{ github.workspace }}" "electron\dist\api\api-engine.exe"
          $tempDir = "$env:TEMP\podgist_uvicorn_test"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$tempDir\logs" | Out-Null

          Write-Host "=== 测试 api-engine.exe 是否能启动（uvicorn 验证）===" -ForegroundColor Cyan
          Write-Host "EXE: $apiEngine"

          # 启动并等待 8 秒
          $proc = Start-Process -FilePath $apiEngine `
            -ArgumentList "--data-dir","$tempDir","--resources-path","${{ github.workspace }}" `
            -PassThru -WindowStyle Hidden

          Start-Sleep 8

          $crashed = $proc.HasExited
          if ($crashed) {
            Write-Host "[CRASH] api-engine.exe 立即退出，exitCode=$($proc.ExitCode)" -ForegroundColor Red
            # 读取错误日志
            $pyLog = "$tempDir\logs\backend-python.log"
            if ((Test-Path $pyLog) -and (Get-Content $pyLog -Raw) -match "Traceback|ModuleNotFoundError|No module") {
              Write-Host "--- backend-python.log 错误 ---" -ForegroundColor Red
              Get-Content $pyLog | Select-Object -Last 10 | ForEach-Object { Write-Host $_ }
            }
            Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "ERROR: uvicorn 未正确打包，api-engine.exe 启动失败" -ForegroundColor Red
            exit 1
          } else {
            Write-Host "[OK] api-engine.exe 在 8 秒后仍运行，uvicorn 打包正确" -ForegroundColor Green
            Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          }

          Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "验证通过" -ForegroundColor Green

      # ===== Electron 安装依赖 =====
      - name: Install electron deps
        run: npm ci
        working-directory: electron

      # ===== Electron 构建 =====
      - name: Build Electron (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ needs.create-release.outputs.tag }}") {
            # Windows 自动更新需要把 latest.yml、blockmap 和安装包上传到正式 Release。
            npm run check:backend
            npm run prebuild
            .\node_modules\.bin\electron-builder.cmd --config electron-builder.yml --win --publish always
          } else {
            npm run build:win
          }
        working-directory: electron

      # ===== 查找 unpacked 目录（用于验包） =====
      - name: Locate unpacked app (Windows)
        id: locate-win-unpacked
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "Current directory: $PWD"
          # 递归查找 win-unpacked 目录
          $unpacked = Get-ChildItem "release" -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "win-unpacked" } | Select-Object -First 1
          if ($unpacked) {
            $path = $unpacked.FullName
            echo "path=$path" >> $env:GITHUB_OUTPUT
            echo "Found: $path"
          } else {
            Write-Host "ERROR: No win-unpacked directory found in release/"
            Get-ChildItem "release" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
            exit 1
          }

      # ===== 验包（打包完成后验证关键文件） =====
      - name: Verify Windows package contents
        shell: pwsh
        run: |
          $unpacked = "${{ steps.locate-win-unpacked.outputs.path }}"
          $errors = @()

          Write-Host "=== 验包: Windows unpacked ==="
          Write-Host "Unpacked path: $unpacked"

          # 检查 api-engine.exe
          $apiEngine = Join-Path $unpacked "resources\api\api-engine.exe"
          if (Test-Path $apiEngine) {
            $size = [math]::Round((Get-Item $apiEngine).Length / 1MB, 2)
            Write-Host "[OK] resources/api/api-engine.exe ($size MB)" -ForegroundColor Green
          } else {
            Write-Host "[MISSING] resources/api/api-engine.exe" -ForegroundColor Red
            $errors += "api-engine.exe"
          }

          # 检查 ffmpeg.exe
          $ffmpeg = Join-Path $unpacked "resources\ffmpeg\ffmpeg.exe"
          if (Test-Path $ffmpeg) {
            Write-Host "[OK] resources/ffmpeg/ffmpeg.exe" -ForegroundColor Green
          } else {
            Write-Host "[MISSING] resources/ffmpeg/ffmpeg.exe" -ForegroundColor Red
            $errors += "ffmpeg.exe"
          }

          # 检查 ffprobe.exe
          $ffprobe = Join-Path $unpacked "resources\ffmpeg\ffprobe.exe"
          if (Test-Path $ffprobe) {
            Write-Host "[OK] resources/ffmpeg/ffprobe.exe" -ForegroundColor Green
          } else {
            Write-Host "[MISSING] resources/ffmpeg/ffprobe.exe" -ForegroundColor Red
            $errors += "ffprobe.exe"
          }

          # 列出 resources 目录内容（用于调试）
          Write-Host ""
          Write-Host "=== resources/ 目录内容 ==="
          $resourcesDir = Join-Path $unpacked "resources"
          if (Test-Path $resourcesDir) {
            Get-ChildItem $resourcesDir | ForEach-Object { Write-Host "  $($_.Name)/" }
          } else {
            Write-Host "  (resources dir not found!)" -ForegroundColor Red
          }

          # 验包失败则禁止上传
          if ($errors.Count -gt 0) {
            Write-Host ""
            Write-Host "ERROR: 验包失败，以下文件缺失: $($errors -join ', ')" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "=== 验包通过 ===" -ForegroundColor Green

      # ===== Windows 后端强制 smoke test =====
      - name: Smoke test Windows backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $unpacked = "${{ steps.locate-win-unpacked.outputs.path }}"
          $apiEngine = Join-Path $unpacked "resources\api\api-engine.exe"
          $tempDataDir = "$env:TEMP\podgist_smoke_$([guid]::NewGuid().ToString('N').Substring(0,8))"
          New-Item -ItemType Directory -Force -Path $tempDataDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$tempDataDir\logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$tempDataDir\archives" | Out-Null
          New-Item -ItemType Directory -Force -Path "$tempDataDir\temp_audio" | Out-Null
          New-Item -ItemType Directory -Force -Path "$tempDataDir\bin" | Out-Null

          Write-Host "=== Smoke Test: Windows api-engine.exe ===" -ForegroundColor Cyan
          Write-Host "EXE: $apiEngine"
          Write-Host "DataDir: $tempDataDir"

          # 复制 ffmpeg 到 smoke 环境
          $srcFFmpeg = Join-Path $unpacked "resources\ffmpeg\ffmpeg.exe"
          $srcFFprobe = Join-Path $unpacked "resources\ffmpeg\ffprobe.exe"
          $smokeBinDir = Join-Path $tempDataDir "bin"
          if (Test-Path $srcFFmpeg) {
            Copy-Item $srcFFmpeg (Join-Path $smokeBinDir "ffmpeg.exe") -Force
            Write-Host "Copied ffmpeg to smoke env"
          }
          if (Test-Path $srcFFprobe) {
            Copy-Item $srcFFprobe (Join-Path $smokeBinDir "ffprobe.exe") -Force
            Write-Host "Copied ffprobe to smoke env"
          }

          # 构建环境变量
          $smokeEnv = @{
            PATH = "$smokeBinDir;$env:PATH"
            PODGIST_DATA_DIR = $tempDataDir
            PODGIST_RESOURCES_PATH = $unpacked
          }

          Write-Host ""
          Write-Host "启动 api-engine.exe（后台，10秒观察）..."
          $proc = Start-Process -FilePath $apiEngine `
            -ArgumentList "--data-dir","$tempDataDir","--resources-path","$unpacked" `
            -PassThru -WindowStyle Hidden -ErrorAction SilentlyContinue
          Write-Host "PID: $($proc.Id)"

          # 观察 10 秒
          Start-Sleep 10

          $crashed = $false
          if ($proc.HasExited) {
            Write-Host "[CRASH] api-engine.exe 在 10 秒内退出，exitCode=$($proc.ExitCode)" -ForegroundColor Red
            $crashed = $true
          } else {
            Write-Host "[OK] 进程 10 秒后仍在运行（uvicorn 启动正常）" -ForegroundColor Green
          }

          # 读取 backend-python.log 查错
          $pyLog = Join-Path $tempDataDir "logs\backend-python.log"
          if ((Test-Path $pyLog) -and (Get-Content $pyLog -Raw) -match "Traceback|Error|Exception") {
            $logContent = Get-Content $pyLog -Raw
            Write-Host ""
            Write-Host "=== backend-python.log 中的错误 ===" -ForegroundColor Red
            Write-Host $logContent -ForegroundColor Red
            $crashed = $true
          }

          # 停止进程
          if (-not $proc.HasExited) {
            Write-Host "停止 api-engine.exe (pid=$($proc.Id))..."
            Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }

          Remove-Item $tempDataDir -Recurse -Force -ErrorAction SilentlyContinue

          if ($crashed) {
            Write-Host ""
            Write-Host "ERROR: Smoke test FAILED — 进程崩溃或日志中有错误" -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "=== Smoke test PASSED ===" -ForegroundColor Green

      # ===== 查找最终安装包产物 =====
      - name: Find installer (Windows)
        shell: pwsh
        id: find-win
        run: |
          echo "=== Searching for .exe installer ==="
          $artifacts = Get-ChildItem "electron/release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            $artifacts = Get-ChildItem "release" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          }
          if ($artifacts) {
            $artifacts | ForEach-Object {
              Write-Host "Found: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
            }
            $first = $artifacts | Select-Object -First 1
            $sha256 = (Get-FileHash $first.FullName -Algorithm SHA256).Hash.ToLower()
            Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($first.FullName)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($first.Name)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "size=$([math]::Round($first.Length / 1MB, 2)) MB"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$sha256"
            Write-Host "SHA256: $sha256"
          } else {
            Write-Host "ERROR: No .exe installer found"
            exit 1
          }

      # ===== 上传 installer artifact =====
      - name: Upload installer artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: podgist-windows
          path: ${{ steps.find-win.outputs.path }}
          retention-days: 5

  # ===== Job D: 统一发布（Linux 中执行 gh release upload） =====
  publish-assets:
    needs: [create-release, build-mac, build-win]
    runs-on: ubuntu-latest
    if: needs.create-release.outputs.tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | while read f; do
            echo "  $f ($(du -h "$f" | cut -f1))"
          done

      - name: Set artifact paths
        id: artifacts
        run: |
          WIN_EXE=$(find artifacts -name "*.exe" -type f | head -1)
          MAC_DMG=$(find artifacts -name "*.dmg" -type f | head -1)
          echo "win_path=$WIN_EXE" >> $GITHUB_OUTPUT
          echo "mac_path=$MAC_DMG" >> $GITHUB_OUTPUT
          echo "Windows artifact: $WIN_EXE"
          echo "macOS artifact: $MAC_DMG"

      - name: Validate artifact sizes before upload
        run: |
          set -euo pipefail

          WIN_EXE="${{ steps.artifacts.outputs.win_path }}"
          MAC_DMG="${{ steps.artifacts.outputs.mac_path }}"

          echo "=== Artifact 合理性检查 ==="

          # Windows exe: 预期 >= 150MB，低于此值直接失败
          WIN_SIZE=$(stat -c%s "$WIN_EXE")
          WIN_SIZE_MB=$((WIN_SIZE / 1048576))
          echo "Windows exe: $WIN_SIZE_MB MB"
          if [ "$WIN_SIZE_MB" -lt 150 ]; then
            echo "ERROR: Windows exe 只有 ${WIN_SIZE_MB}MB，远低于预期的 ~224MB，拒绝上传！" >&2
            echo "SHA256: $(sha256sum "$WIN_EXE" | cut -d' ' -f1)" >&2
            exit 1
          fi
          echo "Windows exe size OK (${WIN_SIZE_MB} MB)"

          # macOS dmg: 预期 >= 100MB
          MAC_SIZE=$(stat -c%s "$MAC_DMG")
          MAC_SIZE_MB=$((MAC_SIZE / 1048576))
          echo "macOS dmg: $MAC_SIZE_MB MB"
          if [ "$MAC_SIZE_MB" -lt 100 ]; then
            echo "ERROR: macOS dmg 只有 ${MAC_SIZE_MB}MB，远低于预期的 ~200MB，拒绝上传！" >&2
            exit 1
          fi
          echo "macOS dmg size OK (${MAC_SIZE_MB} MB)"

          echo ""
          echo "=== SHA256 指纹 ==="
          echo "Windows: $(sha256sum "$WIN_EXE" | cut -d' ' -f1)"
          echo "macOS:   $(sha256sum "$MAC_DMG" | cut -d' ' -f1)"

      - name: Upload Windows artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ASSET_PATH: ${{ steps.artifacts.outputs.win_path }}
        run: |
          echo "Uploading Windows artifact to release $TAG..."
          gh release upload "$TAG" "$ASSET_PATH" --clobber

      - name: Upload macOS artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ASSET_PATH: ${{ steps.artifacts.outputs.mac_path }}
        run: |
          echo "Uploading macOS artifact to release $TAG..."
          gh release upload "$TAG" "$ASSET_PATH" --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "=== Verifying release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) (\(.size | tonumber / 1024 / 1024 | floor) MB)"'

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # Draft Release 对更新客户端不可见；仅在全部构建、验包和上传成功后发布。
          gh release edit "$TAG" --draft=false
