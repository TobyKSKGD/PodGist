name: Build Windows

on:
  push:
    tags:
      - 'v*-windows'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller==6.19.0

      - name: Copy clean backend scripts
        shell: pwsh
        run: |
          Copy-Item "electron/scripts/backend/transcriber.py" "backend/transcriber.py" -Force
          Copy-Item "electron/scripts/backend/llm_agent.py" "backend/llm_agent.py" -Force
          Copy-Item "electron/scripts/backend/rag_retriever.py" "backend/rag_retriever.py" -Force
          Copy-Item "electron/scripts/backend/diagnostics.py" "backend/diagnostics.py" -Force
          Copy-Item "electron/scripts/backend/worker.py" "backend/worker.py" -Force
          Copy-Item "electron/scripts/backend/__init__.py" "backend/__init__.py" -Force
          Copy-Item "electron/scripts/backend/start_electron.py" "backend/start_electron.py" -Force
          Copy-Item "electron/scripts/api.py" "api.py" -Force
          Write-Host "Backend scripts copied"

      - name: Verify backend files exist
        shell: pwsh
        run: |
          $files = @(
            "backend/start_electron.py",
            "backend/__init__.py",
            "backend/transcriber.py",
            "backend/worker.py",
            "backend/api.py"
          )
          foreach ($f in $files) {
            if (Test-Path $f) {
              Write-Host "OK: $f"
            } else {
              Write-Host "MISSING: $f"
              exit 1
            }
          }

      - name: Build backend with PyInstaller
        run: |
          pyinstaller --clean --noconfirm backend/api.spec 2>&1 | Tee-Object -FilePath pyinstaller_output.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PyInstaller FAILED with exit code $LASTEXITCODE"
            exit 1
          }
        env:
          PYTHONOPTIMIZE: '1'

      - name: Show PyInstaller output
        shell: pwsh
        run: |
          if (Test-Path "pyinstaller_output.txt") {
            Get-Content "pyinstaller_output.txt"
          }

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          $required = @(
            "backend/dist/api/api-engine.exe",
            "backend/dist/api/_internal/python311.dll",
            "backend/dist/api/_internal/vcruntime140.dll",
            "backend/dist/api/_internal/vcruntime140_1.dll",
            "backend/dist/api/_internal/msvcp140.dll"
          )

          if (-not (Test-Path "backend/dist/api")) {
            Write-Host "ERROR: backend/dist/api not found"
            exit 1
          }

          Get-ChildItem "backend/dist/api" -Recurse |
            Select-Object FullName |
            Format-Table -AutoSize

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Host "ERROR: Missing $path"
              exit 1
            }
          }

          Write-Host "PyInstaller output verified."

      - name: Copy api dist to electron/dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "electron/dist" | Out-Null
          Remove-Item "electron/dist/api" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "backend/dist/api" "electron/dist/" -Recurse -Force

          if (-not (Test-Path "electron/dist/api/api-engine.exe")) {
            Write-Host "ERROR: electron/dist/api/api-engine.exe not found after copy"
            exit 1
          }

          Get-ChildItem "electron/dist/api" -Recurse |
            Select-Object FullName |
            Format-Table -AutoSize

      - name: Download ffmpeg for Windows
        shell: pwsh
        run: |
          $ffmpegDir = "${{ github.workspace }}\electron\resources\ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zipPath = "$env:TEMP\ffmpeg.zip"

          Write-Host "Downloading ffmpeg..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zipPath

          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_extracted" -Force

          $ffmpegExe = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($ffmpegExe) {
            Copy-Item $ffmpegExe.FullName -Destination $ffmpegDir -Force
            Write-Host "ffmpeg.exe ready"
          } else {
            Write-Host "ERROR: ffmpeg.exe not found"
            exit 1
          }

          $ffprobeExe = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($ffprobeExe) {
            Copy-Item $ffprobeExe.FullName -Destination $ffmpegDir -Force
            Write-Host "ffprobe.exe ready"
          } else {
            Write-Host "ERROR: ffprobe.exe not found"
            exit 1
          }

          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\ffmpeg_extracted" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install npm deps
        run: npm ci
        working-directory: electron

      - name: Build Electron app (Windows)
        run: npm run build:win
        working-directory: electron

      - name: Find built installer
        shell: pwsh
        run: |
          Get-ChildItem "release" -Filter "*.exe" -Recurse |
            Select-Object FullName, @{N="SizeMB";E={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v1.0.0"
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse | Select-Object -First 1

          if (-not $installer) {
            Write-Host "ERROR: No installer found"
            exit 1
          }

          $sizeMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Uploading $($installer.Name) ($sizeMB MB) to release $tag"
          gh release upload "$tag" $installer.FullName --clobber
