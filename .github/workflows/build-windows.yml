name: Build Windows

on:
  push:
    tags:
      - 'v*-windows'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller==6.19.0

      # ===== 核心修复：替换危险的逐文件复制为完整覆盖 =====
      - name: Sync backend from electron/scripts
        shell: pwsh
        run: |
          # 把 electron/scripts/backend/ 完整同步到项目根目录 backend/
          # 这样 PyInstaller 构建时用的是 electron 源码的精确副本
          $src = "electron/scripts/backend"
          $dest = "backend"
          Write-Host "=== Syncing $src -> $dest ==="

          # 先清空目标目录（保留 backend/ 目录本身）
          if (Test-Path $dest) {
            Get-ChildItem -Path $dest -File | Remove-Item -Force
            Get-ChildItem -Path $dest -Directory | Remove-Item -Recurse -Force
          } else {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
          }

          # 复制所有 .py 文件
          Copy-Item -Path "$src/*.py" -Destination $dest -Force
          Write-Host "Copied *.py files"

          # 确保 __init__.py 存在
          if (-not (Test-Path "$dest/__init__.py")) {
            "" | Out-File -FilePath "$dest/__init__.py" -Encoding utf8
          }

          # 同步 api.py
          Copy-Item "electron/scripts/api.py" "api.py" -Force

          # 列出同步结果
          Write-Host "=== backend/ contents after sync ==="
          Get-ChildItem -Path $dest -Recurse | Select-Object FullName

      # ===== 新增：后端语法检查（在 PyInstaller 之前）=====
      - name: Syntax check backend
        run: python scripts/check_backend.py

      - name: Verify backend files
        shell: pwsh
        run: |
          $files = @(
            "backend/start_electron.py",
            "backend/__init__.py",
            "backend/downloader.py",
            "backend/transcriber.py",
            "backend/worker.py",
            "backend/llm_agent.py",
            "backend/rag_retriever.py",
            "backend/diagnostics.py",
            "backend/rag_db.py",
            "backend/task_queue.py",
            "backend/package_manager.py",
            "backend/model_manager.py",
            "api.py"
          )
          foreach ($f in $files) {
            if (Test-Path $f) {
              Write-Host "OK: $f"
            } else {
              Write-Host "MISSING: $f"
              exit 1
            }
          }

      - name: Build backend with PyInstaller
        shell: pwsh
        run: |
          Write-Host "=== Running PyInstaller ==="
          pyinstaller --clean --noconfirm backend/api.spec
          $exit = $LASTEXITCODE
          Write-Host "PyInstaller EXIT_CODE=$exit"
          if ($exit -ne 0) {
            Write-Host "ERROR: PyInstaller failed with exit code $exit"
            exit 1
          }

          # 统一 apiDist 路径
          if (Test-Path "backend/dist/api") {
            $script:apiDist = "backend/dist/api"
            Write-Host "OUTPUT_FOUND=backend/dist/api"
          } elseif (Test-Path "dist/api") {
            $script:apiDist = "dist/api"
            Write-Host "OUTPUT_FOUND=dist/api"
          } else {
            Write-Host "ERROR: api dist not found at either backend/dist/api or dist/api"
            Get-ChildItem . -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
            exit 1
          }
          Write-Host "Resolved apiDist=$apiDist"
        env:
          PYTHONOPTIMIZE: '1'

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          # 统一 apiDist 路径
          $apiDist = if (Test-Path "backend/dist/api") { "backend/dist/api" } elseif (Test-Path "dist/api") { "dist/api" } else { throw "api dist not found" }

          $required = @(
            "$apiDist/api-engine.exe",
            "$apiDist/_internal/python311.dll",
            "$apiDist/_internal/vcruntime140.dll",
            "$apiDist/_internal/vcruntime140_1.dll",
            "$apiDist/_internal/msvcp140.dll"
          )

          Write-Host "=== Verifying $apiDist contents ==="
          Get-ChildItem "$apiDist" -Recurse | Select-Object FullName | Format-Table -AutoSize

          foreach ($path in $required) {
            if (Test-Path $path) {
              Write-Host "OK: $path"
            } else {
              Write-Host "ERROR: Missing $path"
              exit 1
            }
          }
          Write-Host "PyInstaller output verified."

      - name: Copy api dist to electron/dist
        shell: pwsh
        run: |
          $apiDist = if (Test-Path "backend/dist/api") { "backend/dist/api" } elseif (Test-Path "dist/api") { "dist/api" } else { throw "api dist not found" }

          New-Item -ItemType Directory -Force -Path "electron/dist" | Out-Null
          Remove-Item "electron/dist/api" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $apiDist "electron/dist/" -Recurse -Force

          if (-not (Test-Path "electron/dist/api/api-engine.exe")) {
            Write-Host "ERROR: electron/dist/api/api-engine.exe not found"
            exit 1
          }

          # 打印最终 api 目录结构
          Write-Host "=== electron/dist/api/ final structure ==="
          Get-ChildItem "electron/dist/api" -Recurse |
            Where-Object { $_.Name -match '\.(exe|dll)$' } |
            Select-Object FullName |
            Format-Table -AutoSize

      - name: Download ffmpeg for Windows
        shell: pwsh
        run: |
          $ffmpegDir = "${{ github.workspace }}\electron\resources\ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zipPath = "$env:TEMP\ffmpeg.zip"

          Write-Host "Downloading ffmpeg..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zipPath

          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_extracted" -Force

          $ffmpegExe = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($ffmpegExe) {
            Copy-Item $ffmpegExe.FullName -Destination $ffmpegDir -Force
            Write-Host "ffmpeg.exe ready"
          } else {
            Write-Host "ERROR: ffmpeg.exe not found"
            exit 1
          }

          $ffprobeExe = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($ffprobeExe) {
            Copy-Item $ffprobeExe.FullName -Destination $ffmpegDir -Force
            Write-Host "ffprobe.exe ready"
          } else {
            Write-Host "ERROR: ffprobe.exe not found"
            exit 1
          }

          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\ffmpeg_extracted" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "=== electron/resources/ffmpeg/ contents ==="
          Get-ChildItem $ffmpegDir | Select-Object Name | Format-Table

      - name: Install npm deps
        run: npm ci
        working-directory: electron

      - name: Build Electron app (Windows)
        run: npm run build:win
        working-directory: electron

      - name: Find built installer
        shell: pwsh
        run: |
          Get-ChildItem "release" -Filter "*.exe" -Recurse |
            Select-Object FullName, @{N="SizeMB";E={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # 动态解析 release tag
          $inputTag = "${{ github.event.inputs.tag }}"
          $refName = "${{ github.ref_name }}"
          if ($inputTag) {
            $resolvedTag = $inputTag.Trim()
          } elseif ($refName -match '^v\d+\.\d+\.\d+-windows$') {
            # v1.0.0-windows -> v1.0.0
            $resolvedTag = $refName -replace '-windows$', ''
          } else {
            $resolvedTag = $refName
          }
          Write-Host "Resolved release tag = $resolvedTag"

          $installer = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Host "ERROR: No installer found"
            exit 1
          }

          $sizeMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Uploading $($installer.Name) ($sizeMB MB) to release $resolvedTag"
          gh release upload "$resolvedTag" $installer.FullName --clobber
